<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111318">
<title>SEErch²</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wallpaper"></div>
<div id="app">
<header class="site-header" data-layout-id="header">
<a class="brand" id="brand" href="#home" data-editable="true">SEErch²</a>
<div class="header-actions">
<button class="icon-button" id="settingsButton" type="button" aria-label="Settings">Settings</button>
</div>
</header>

<main id="main">
<section id="homePage" class="page">
<div class="home-center">
<form id="homeSearchForm" class="search-form large-search" data-editable="true">
<input id="homeSearchInput" autocomplete="off" placeholder="Search the web" aria-label="Search">
<button type="submit">Search</button>
</form>
<div id="homeWidgets" class="widget-grid" data-layout-id="home-widgets"></div>
</div>
</section>

<section id="resultsPage" class="page hidden">
<div class="results-top">
<form id="resultsSearchForm" class="search-form results-search">
<input id="resultsSearchInput" autocomplete="off" placeholder="Search the web" aria-label="Search results">
<button type="submit">Search</button>
</form>
</div>
<nav id="tabs" class="tabs" aria-label="Search types">
<button data-tab="web" class="active" type="button">Web</button>
<button data-tab="images" type="button">Images</button>
<button data-tab="videos" type="button">Videos</button>
<button data-tab="news" type="button">News</button>
</nav>
<div id="resultsMeta" class="results-meta"></div>
<div id="resultsList" class="results-list"></div>
<div id="resultsSentinel"></div>
</section>
</main>
</div>

<div id="settingsPanel" class="drawer hidden">
<div class="drawer-panel">
<div class="drawer-header"><h2>Settings</h2><button type="button" data-close="settingsPanel">Close</button></div>
<div id="settingsContent"></div>
</div>
</div>

<div id="modalRoot"></div>
<div id="toast" class="toast hidden"></div>
<script src="app.js"></script>
</body>
</html>
